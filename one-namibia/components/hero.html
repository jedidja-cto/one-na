<section class="hero" id="home">
  <div class="hero-dots"></div>

  <!-- Oryx silhouette left -->
  <svg class="hero-ani hero-ani-l" width="110" height="160" viewBox="0 0 110 160" fill="none">
    <ellipse cx="55" cy="108" rx="30" ry="38" fill="var(--navy)"></ellipse>
    <circle cx="55" cy="42" r="20" fill="var(--navy)"></circle>
    <path d="M50 2 L44 22" stroke="var(--navy)" stroke-width="2.5" stroke-linecap="round"></path>
    <path d="M60 2 L66 22" stroke="var(--navy)" stroke-width="2.5" stroke-linecap="round"></path>
    <path d="M38 140 L33 160" stroke="var(--navy)" stroke-width="3.5" stroke-linecap="round"></path>
    <path d="M72 140 L77 160" stroke="var(--navy)" stroke-width="3.5" stroke-linecap="round"></path>
    <path d="M42 140 L40 156" stroke="var(--navy)" stroke-width="3" stroke-linecap="round"></path>
    <path d="M68 140 L70 156" stroke="var(--navy)" stroke-width="3" stroke-linecap="round"></path>
  </svg>

  <!-- Elephant silhouette right -->
  <svg class="hero-ani hero-ani-r" width="130" height="160" viewBox="0 0 130 160" fill="none">
    <ellipse cx="68" cy="108" rx="42" ry="36" fill="var(--navy)"></ellipse>
    <circle cx="68" cy="46" r="27" fill="var(--navy)"></circle>
    <ellipse cx="24" cy="72" rx="18" ry="12" fill="var(--navy)"></ellipse>
    <path d="M24 84 L20 110 Q18 118 22 120" stroke="var(--navy)" stroke-width="5" stroke-linecap="round" fill="none"></path>
    <path d="M48 138 L44 160" stroke="var(--navy)" stroke-width="5" stroke-linecap="round"></path>
    <path d="M60 142 L60 160" stroke="var(--navy)" stroke-width="5" stroke-linecap="round"></path>
    <path d="M76 142 L76 160" stroke="var(--navy)" stroke-width="5" stroke-linecap="round"></path>
    <path d="M88 138 L92 160" stroke="var(--navy)" stroke-width="5" stroke-linecap="round"></path>
  </svg>

  <div class="hero-eyebrow">Namibia's Business Directory</div>
  <h1 class="hero-h1">ONE</h1>
  <div class="hero-tagline">Connect · Discover · Grow</div>

  <div class="search-outer">
    <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="6"></circle>
      <path d="M21 21l-4.35-4.35"></path>
    </svg>
    <input class="search-bar" id="heroSearch" type="text" placeholder="Search companies, services or regions…" oninput="syncHeroSearch()">
    <button class="search-go" onclick="goToDirectory()">Search</button>
  </div>

  <div class="hero-pills" id="heroPills"></div>

  <div class="hero-stats">
    <span><strong id="statBiz">15</strong> businesses</span>
    <span class="hd"></span>
    <span><strong>15</strong> sectors</span>
    <span class="hd"></span>
    <span><strong>14</strong> regions</span>
    <span class="hd"></span>
    <span>🇳🇦 Namibia</span>
  </div>

  <div class="scroll-hint">
    <span>Explore</span>
    <div class="scroll-line"></div>
  </div>

  <!-- dune waves -->
  <svg class="hero-dune" viewBox="0 0 1440 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,200 C360,80 720,160 1080,100 C1260,65 1360,105 1440,80 L1440,200Z" fill="var(--cream-dark)" opacity=".55"></path>
    <path d="M0,200 C240,110 560,170 900,130 C1100,108 1280,140 1440,120 L1440,200Z" fill="var(--cream-dark)"></path>
  </svg>
</section>
