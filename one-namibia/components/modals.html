<!-- LISTING MODAL -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal-box" id="modalBox">
    <button class="modal-close-btn" onclick="closeModal()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- LIST FORM MODAL -->
<div class="form-bg" id="formBg" onclick="closeForm(event)">
  <div class="form-box">
    <button class="form-close" onclick="closeForm()">✕</button>
    <div id="formBody"></div>
  </div>
</div>

<!-- FLOAT -->
<button class="float-btn" onclick="openListForm()">+ List Your Business</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>
